{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "tracepcap.postgresql.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tracepcap.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  annotations:
    # Deleting this on uninstall would orphan the data volume's password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  password: {{ include "tracepcap.secretValue" (dict "ctx" . "secret" $name "key" "password" "value" .Values.postgresql.auth.password) | b64enc | quote }}
---
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracepcap.database.secretName" . }}
  labels:
    {{- include "tracepcap.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ required "externalDatabase.password (or externalDatabase.existingSecret) is required" .Values.externalDatabase.password | b64enc | quote }}
---
{{- end }}
{{- if and .Values.minio.enabled (not .Values.minio.auth.existingSecret) }}
{{- $name := include "tracepcap.minio.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tracepcap.componentLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  root-user: {{ .Values.minio.auth.rootUser | b64enc | quote }}
  root-password: {{ include "tracepcap.secretValue" (dict "ctx" . "secret" $name "key" "root-password" "value" .Values.minio.auth.rootPassword) | b64enc | quote }}
---
{{- end }}
{{- if and (not .Values.minio.enabled) (not .Values.externalS3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracepcap.s3.secretName" . }}
  labels:
    {{- include "tracepcap.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ required "externalS3.accessKey (or externalS3.existingSecret) is required" .Values.externalS3.accessKey | b64enc | quote }}
  secret-key: {{ required "externalS3.secretKey (or externalS3.existingSecret) is required" .Values.externalS3.secretKey | b64enc | quote }}
---
{{- end }}
{{- if not .Values.backend.llm.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracepcap.llm.secretName" . }}
  labels:
    {{- include "tracepcap.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
type: Opaque
data:
  {{ .Values.backend.llm.existingSecretKey }}: {{ .Values.backend.llm.apiKey | default "not-set" | b64enc | quote }}
{{- end }}
